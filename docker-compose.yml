#
version: "3.8"
services:
    frontend:
        build:
            context: ./app/client
        ports:
            - "3000:80"
        restart: always
        depends_on:
            - backend
    backend:
        build:
            context: ./app/server
        env_file:
            - ./app/server/.env
        ports:
            - "8000:8000"
        restart: always
        depends_on:
            - routeplanner
    routeplanner:
        build:
            context: ./routeplanner
        ports:
            - "5000:5000"
        restart: always
        depends_on:
            - osrm
    osrm:
        image: osrm/osrm-backend
        container_name: crm-copy-osrm
        ports:
            - "6000:5000"
        volumes:
            - ./osrm-data:/data
        command: osrm-routed --algorithm mld /data/uk-latest.osrm
        restart: always